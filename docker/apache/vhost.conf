<VirtualHost *:80>
    ServerName cardmancer.local
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cardmancer-error.log
    CustomLog ${APACHE_LOG_DIR}/cardmancer-access.log combined
</VirtualHost>
